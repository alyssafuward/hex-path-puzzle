<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Sky Path</title>
<style>
  :root{
    --pale-sky:#F2F8FD;
    --mid-sky:#C8DEF0;
    --deep-sky:#1F6FA8;
    --white:#FFFFFF;
    --ink:#1A1A1A;
    --mid-grey:#666666;
    --sky-rule:#D8ECF8;
    --orange:#F88C00;
    --path-fill:#1F6FA8;
    --path-fill-light:#4A8FC2;
    --wrong:#E0563F;
  }

  @font-face{
    font-family:'DM Serif Display';
    src:local('DM Serif Display');
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--pale-sky);
    font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 64px;
  }

  h1{
    font-family:'DM Serif Display', Georgia, serif;
    font-weight:400;
    font-size:34px;
    margin:0 0 4px;
    color:var(--ink);
    text-align:center;
  }

  .tagline{
    font-size:14px;
    color:var(--mid-grey);
    margin:0 0 24px;
    text-align:center;
    max-width:420px;
  }

  .eyebrow{
    font-family:'DM Sans', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--deep-sky);
    margin-bottom:6px;
  }

  .hud{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .pill{
    background:var(--white);
    border:1px solid var(--sky-rule);
    border-radius:999px;
    padding:8px 18px;
    font-size:14px;
    font-weight:600;
    color:var(--deep-sky);
    display:flex;
    align-items:center;
    gap:6px;
  }

  button.newgame{
    background:var(--deep-sky);
    color:var(--white);
    border:none;
    border-radius:999px;
    padding:10px 22px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'DM Sans', sans-serif;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  button.newgame:hover{
    background:#195a87;
    transform:translateY(-1px);
  }
  button.newgame:active{
    transform:translateY(0px);
  }
  button.newgame:focus-visible{
    outline:3px solid var(--orange);
    outline-offset:2px;
  }

  .board-wrap{
    background:var(--white);
    border-radius:24px;
    padding:20px;
    box-shadow:0 2px 24px rgba(31,111,168,0.10);
    max-width:100%;
    overflow-x:auto;
  }

  svg{
    display:block;
  }

  .hex{
    cursor:pointer;
    stroke:var(--sky-rule);
    stroke-width:2;
    transition:fill 0.15s ease, stroke 0.15s ease;
  }
  .hex.decoy{
    fill:var(--pale-sky);
  }
  .hex.decoy:hover{
    fill:var(--mid-sky);
  }
  .hex.path-cell{
    fill:var(--pale-sky);
  }
  .hex.path-cell:hover{
    fill:var(--mid-sky);
  }
  .hex.solved{
    fill:var(--deep-sky);
    stroke:var(--deep-sky);
  }
  .hex.start-cell{
    fill:var(--mid-sky);
    stroke:var(--deep-sky);
    stroke-width:3;
  }
  .hex.finish-cell{
    fill:var(--mid-sky);
    stroke:var(--orange);
    stroke-width:3;
  }
  .hex.wrong{
    fill:var(--wrong) !important;
    stroke:var(--wrong) !important;
  }
  .hex.wrong-flash{
    animation: shake 0.35s ease;
  }
  .hex.tried-wrong{
    fill:#F7D9D2 !important;
    stroke:var(--wrong) !important;
  }
  .hex-label.on-tried-wrong{
    fill:var(--wrong);
  }
  @keyframes shake{
    0%{ transform:translateX(0); }
    25%{ transform:translateX(-3px); }
    50%{ transform:translateX(3px); }
    75%{ transform:translateX(-2px); }
    100%{ transform:translateX(0); }
  }

  .hex-label{
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    font-weight:600;
    fill:var(--ink);
    pointer-events:none;
    text-anchor:middle;
    dominant-baseline:central;
  }
  .hex.solved + .hex-label,
  .hex-label.on-solved{
    fill:var(--white);
  }
  .hex-label.on-wrong{
    fill:var(--white);
  }

  .tiny-tag{
    font-family:'DM Sans', sans-serif;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    fill:var(--deep-sky);
    text-anchor:middle;
    pointer-events:none;
  }
  .tiny-tag.on-solved{ fill:var(--white); }

  .trace-line{
    fill:none;
    stroke:var(--orange);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0.85;
  }

  .win-overlay{
    position:fixed;
    inset:0;
    background:rgba(31,111,168,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .win-overlay.show{ display:flex; }
  .win-card{
    background:var(--white);
    border-radius:24px;
    padding:36px 40px;
    text-align:center;
    max-width:340px;
    box-shadow:0 12px 40px rgba(0,0,0,0.2);
  }
  .win-card h2{
    font-family:'DM Serif Display', serif;
    font-weight:400;
    font-size:26px;
    margin:0 0 8px;
    color:var(--ink);
  }
  .win-card p{
    color:var(--mid-grey);
    font-size:14px;
    margin:0 0 20px;
  }

  footer{
    margin-top:20px;
    font-size:12px;
    color:var(--mid-grey);
    text-align:center;
  }
</style>
</head>
<body>

  <div class="eyebrow">A hive of your own</div>
  <h1>The Sky Path</h1>
  <p class="tagline">Trace the hexes from 1 to 50, in order, through the hive. Every neighbor counts.</p>

  <div class="hud">
    <div class="pill" id="progressPill">Step 0 / 50</div>
    <div class="pill" id="nextPill">Next: 1</div>
    <div class="pill" id="mistakePill">Mistakes: 0</div>
    <button class="newgame" id="newGameBtn">New Game</button>
  </div>

  <div class="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <footer>Click Start, then follow the numbers — each step must be a neighboring hex.</footer>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <h2>You found the path!</h2>
      <p id="winStats">50 steps, 0 mistakes.</p>
      <button class="newgame" id="playAgainBtn">Play Again</button>
    </div>
  </div>

<script>
(function(){
  const COLS = 9;
  const ROWS = 10;
  const PATH_LEN = 50;
  const SIZE = 30; // hex center-to-corner

  const svg = document.getElementById('board');
  const progressPill = document.getElementById('progressPill');
  const nextPill = document.getElementById('nextPill');
  const mistakePill = document.getElementById('mistakePill');
  const winOverlay = document.getElementById('winOverlay');
  const winStats = document.getElementById('winStats');

  let cells = [];        // flat list of cell objects
  let grid = {};         // key "c,r" -> cell
  let expected = 1;       // next pathIndex expected
  let lastCell = null;    // last correctly clicked cell
  let mistakes = 0;
  let solvedCells = [];
  let traceLine = null;

  function cellKey(c,r){ return c+','+r; }

  // ---------- geometry (flat-top hexes, odd-q vertical offset) ----------
  function hexCenter(c,r){
    const w = SIZE*2;
    const hspacing = SIZE*1.5;
    const vspacing = Math.sqrt(3)*SIZE;
    const x = SIZE + c*hspacing;
    const y = vspacing/2 + r*vspacing + ((c%2)? vspacing/2 : 0);
    return {x,y};
  }

  function hexPoints(cx,cy){
    const pts = [];
    for(let i=0;i<6;i++){
      const angle = Math.PI/180 * (60*i);
      pts.push([cx + SIZE*Math.cos(angle), cy + SIZE*Math.sin(angle)]);
    }
    return pts.map(p=>p.join(',')).join(' ');
  }

  function neighborsOf(c,r){
    const even = (c%2===0);
    if(even){
      return [
        [c,r-1],[c,r+1],
        [c-1,r-1],[c-1,r],
        [c+1,r-1],[c+1,r]
      ];
    } else {
      return [
        [c,r-1],[c,r+1],
        [c-1,r],[c-1,r+1],
        [c+1,r],[c+1,r+1]
      ];
    }
  }

  function oddqToCube(c,r){
    const x = c;
    const z = r - (c - (c&1))/2;
    const y = -x-z;
    return {x,y,z};
  }
  function hexDistance(a,b){
    const ca = oddqToCube(a.c,a.r);
    const cb = oddqToCube(b.c,b.r);
    return Math.max(Math.abs(ca.x-cb.x), Math.abs(ca.y-cb.y), Math.abs(ca.z-cb.z));
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  // ---------- build grid ----------
  function buildGrid(){
    cells = [];
    grid = {};
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const cell = {c,r,pathIndex:null,label:null};
        cells.push(cell);
        grid[cellKey(c,r)] = cell;
      }
    }
  }

  function getCell(c,r){ return grid[cellKey(c,r)]; }

  // ---------- generate a random self-avoiding walk of length PATH_LEN ----------
  function generatePath(){
    const maxAttempts = 60;
    for(let attempt=0; attempt<maxAttempts; attempt++){
      const startC = Math.floor(Math.random()*COLS);
      const startR = Math.floor(Math.random()*ROWS);
      const visited = new Set();
      const path = [];
      let steps = 0;
      const stepCap = 20000;

      function dfs(c,r){
        steps++;
        if(steps>stepCap) return false;
        const key = cellKey(c,r);
        visited.add(key);
        path.push(getCell(c,r));
        if(path.length===PATH_LEN) return true;

        const neigh = shuffle(neighborsOf(c,r).filter(([nc,nr])=> grid[cellKey(nc,nr)]));
        for(const [nc,nr] of neigh){
          const nkey = cellKey(nc,nr);
          if(!visited.has(nkey)){
            if(dfs(nc,nr)) return true;
          }
        }
        // backtrack
        visited.delete(key);
        path.pop();
        return false;
      }

      if(dfs(startC,startR)){
        return path;
      }
    }
    return null;
  }

  // ---------- assign labels ----------
  function assignLabels(path){
    path.forEach((cell,i)=>{
      cell.pathIndex = i+1;
      cell.label = i+1;
    });

    const pathCells = path;
    cells.forEach(cell=>{
      if(cell.pathIndex) return; // already on path
      // find nearest path cell
      let best = null, bestDist = Infinity;
      for(const pc of pathCells){
        const d = hexDistance(cell,pc);
        if(d<bestDist){ bestDist = d; best = pc; }
      }
      const base = best.pathIndex;
      const offset = Math.floor(Math.random()*9) - 4; // -4..4
      let val = base + offset;
      val = Math.max(1, Math.min(PATH_LEN, val));
      cell.label = val;
    });
  }

  // ---------- render ----------
  function render(){
    svg.innerHTML = '';
    const maxX = SIZE + (COLS-1)*SIZE*1.5 + SIZE + 8;
    const maxY = Math.sqrt(3)*SIZE*(ROWS) + Math.sqrt(3)*SIZE/2 + 8;
    svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);
    svg.setAttribute('width', Math.min(maxX, 620));
    svg.setAttribute('height', maxY * (Math.min(maxX,620)/maxX) );

    // trace line under hexes
    traceLine = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    traceLine.setAttribute('class','trace-line');
    traceLine.setAttribute('points','');
    svg.appendChild(traceLine);

    cells.forEach(cell=>{
      const {x,y} = hexCenter(cell.c,cell.r);
      cell._cx = x; cell._cy = y;

      const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
      poly.setAttribute('points', hexPoints(x,y));
      let cls = 'hex ' + (cell.pathIndex ? 'path-cell' : 'decoy');
      if(cell.pathIndex===1) cls += ' start-cell';
      if(cell.pathIndex===PATH_LEN) cls += ' finish-cell';
      poly.setAttribute('class', cls);
      poly.dataset.key = cellKey(cell.c,cell.r);
      poly.addEventListener('click', ()=>handleClick(cell, poly));
      svg.appendChild(poly);
      cell._poly = poly;

      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', x);
      label.setAttribute('y', cell.pathIndex===1 || cell.pathIndex===PATH_LEN ? y+7 : y);
      label.setAttribute('class','hex-label');
      label.textContent = cell.label;
      svg.appendChild(label);
      cell._label = label;

      if(cell.pathIndex===1){
        const tag = document.createElementNS('http://www.w3.org/2000/svg','text');
        tag.setAttribute('x', x);
        tag.setAttribute('y', y-11);
        tag.setAttribute('class','tiny-tag');
        tag.textContent = 'START';
        svg.appendChild(tag);
        cell._tag = tag;
      }
      if(cell.pathIndex===PATH_LEN){
        const tag = document.createElementNS('http://www.w3.org/2000/svg','text');
        tag.setAttribute('x', x);
        tag.setAttribute('y', y-11);
        tag.setAttribute('class','tiny-tag');
        tag.textContent = 'FINISH';
        svg.appendChild(tag);
        cell._tag = tag;
      }
    });
  }

  function updateTraceLine(){
    const pts = solvedCells.map(c=>`${c._cx},${c._cy}`).join(' ');
    traceLine.setAttribute('points', pts);
  }

  // ---------- interaction ----------
  function handleClick(cell, poly){
    if(cell.pathIndex === expected && (expected===1 || (lastCell && hexDistance(cell,lastCell)===1))){
      poly.classList.remove('decoy','path-cell','start-cell','finish-cell');
      poly.classList.add('solved');
      cell._label.classList.add('on-solved');
      if(cell._tag) cell._tag.classList.add('on-solved');
      solvedCells.push(cell);
      updateTraceLine();
      lastCell = cell;
      expected++;
      progressPill.textContent = `Step ${expected-1} / ${PATH_LEN}`;
      nextPill.textContent = expected>PATH_LEN ? 'Done!' : `Next: ${expected}`;

      if(expected-1 === PATH_LEN){
        setTimeout(()=>{
          winStats.textContent = `50 steps, ${mistakes} mistake${mistakes===1?'':'s'}.`;
          winOverlay.classList.add('show');
        }, 250);
      }
    } else {
      // don't re-count or re-mark a cell already flagged wrong
      if(!poly.classList.contains('tried-wrong')){
        mistakes++;
        mistakePill.textContent = `Mistakes: ${mistakes}`;
      }
      poly.classList.add('wrong-flash','tried-wrong');
      if(cell._label) cell._label.classList.add('on-tried-wrong');
      setTimeout(()=>{
        poly.classList.remove('wrong-flash');
      }, 350);
    }
  }

  // ---------- new game ----------
  function newGame(){
    winOverlay.classList.remove('show');
    expected = 1;
    lastCell = null;
    mistakes = 0;
    solvedCells = [];
    progressPill.textContent = `Step 0 / ${PATH_LEN}`;
    nextPill.textContent = `Next: 1`;
    mistakePill.textContent = `Mistakes: 0`;

    buildGrid();
    const path = generatePath();
    if(!path){
      // extremely unlikely fallback: try again
      newGame();
      return;
    }
    assignLabels(path);
    render();
  }

  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('playAgainBtn').addEventListener('click', newGame);

  newGame();
})();
</script>

</body>
</html>
